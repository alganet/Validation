name: TheRespectPanda Bot

on:
  issue_comment:
    types: [created]

jobs:
  listen-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Reads Command
        run: |
          {
            case "${{ github.event.comment.body }}" in
              "@TheRespectPanda ping") echo "pong" ;;
            esac
          } > .TheRespectPanda_response.md 2>&1

      - name: Produces Response
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PANDA_GITHUB_PAT }}
          script: |
            const fs = require('fs');
            const response = 'generic pong';
            if (response.trim() !== '') {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: response
              });
            }